<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediTrack</title>
<style>
:root{--bg:#f5f7fa;--c:#fff;--t:#1d2733;--m:#667585;--a:#1f3a5f;--b:#d6dde6;--r:#c0392b;--g:#1e8449;--y:#b9770e;--rb:#fdecea;--gb:#e9f7ef;--yb:#fef5e7}
@media(prefers-color-scheme:dark){:root{--bg:#10161d;--c:#18212b;--t:#e6ebf0;--m:#9aa7b4;--a:#6ea8ff;--b:#2b3744;--r:#ff8a7a;--g:#4cc38a;--y:#e5b455;--rb:#3a1f1c;--gb:#16301f;--yb:#33291a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--a);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
@media(prefers-color-scheme:dark){header{color:#10161d}}
header b{font-size:18px}main{max-width:1050px;margin:0 auto;padding:16px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}nav a{padding:6px 14px;border:1px solid var(--b);border-radius:20px;color:var(--t);text-decoration:none;background:var(--c)}nav a.on{background:var(--a);color:#fff;border-color:var(--a)}
@media(prefers-color-scheme:dark){nav a.on{color:#10161d}}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:14px}.stat{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px}.stat b{font-size:24px;display:block}.stat span{color:var(--m);font-size:13px}
h2,h3,h4{margin:0 0 8px}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--b);white-space:nowrap}th{font-size:12px;color:var(--m);text-transform:uppercase}
button{background:var(--a);color:#fff;border:0;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}@media(prefers-color-scheme:dark){button{color:#10161d}}
button.ghost{background:transparent;color:var(--t);border:1px solid var(--b)}button.bad{background:var(--r)}button:disabled{opacity:.4;cursor:not-allowed}
input,textarea,select{width:100%;padding:7px;border:1px solid var(--b);border-radius:6px;font:inherit;background:var(--c);color:var(--t)}label{display:block;margin:8px 0;font-size:13px;color:var(--m)}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;display:inline-block}.red{background:var(--rb);color:var(--r)}.grn{background:var(--gb);color:var(--g)}.yel{background:var(--yb);color:var(--y)}
.alert{padding:10px 12px;border-radius:8px;margin-bottom:10px}.alert.red{border:1px solid var(--r)}.alert.yel{border:1px solid var(--y)}.alert.grn{border:1px solid var(--g)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}dialog{border:1px solid var(--b);border-radius:12px;padding:18px;width:min(560px,94vw);background:var(--c);color:var(--t)}dialog::backdrop{background:#0008}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:8px;background:var(--a);color:#fff;display:none;z-index:9}#toast.bad{background:var(--r)}
.login{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}.login button{padding:18px;text-align:left}.login small{display:block;opacity:.85;margin-top:4px}
.bar{height:10px;background:var(--b);border-radius:5px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.chip{background:var(--c);color:var(--t);border:1px solid var(--b)}.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
@media(prefers-color-scheme:dark){.chip.on{color:#10161d}}
.guide{background:var(--yb);border-left:4px solid var(--y);padding:10px 12px;border-radius:6px;margin-bottom:14px}
.lg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;max-width:900px;margin:24px auto}.err{color:var(--r);min-height:20px;font-size:13px}code{background:var(--bg);padding:2px 6px;border-radius:4px}
button{padding:9px 14px}
</style></head><body>
<header><b>MediTrack &middot; Quarantine &amp; Treatment Facility</b><span id="who"></span></header>
<main id="app"></main><div id="toast"></div><dialog id="dlg"></dialog>
<script>
let FEV=100.4;const CAP=74,K='meditrack-v2';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const day=(o=0)=>{const d=new Date(Date.now()+o*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const nowT=()=>new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const USERS={admin:'Asha (Admin)',nurse:'Nurse Priya',doctor:'Dr. Rao',management:'Management'};
function seed(){let s=7;const r=()=>(s=s*16807%2147483647)/2147483647;
 const F=['Aarav','Diya','Kabir','Meera','Rohan','Sana','Vihaan','Isha','Arjun','Neha','Yash','Tara','Dev','Anika','Kunal','Riya','Manav','Pooja','Samir','Zoya'],L=['Shah','Patil','Khan','Iyer','Mehta','Nair','Joshi','Rao','Gupta','Das'];
 const S={p:[],ev:[],n:100,user:null};
 for(let i=1;i<=CAP;i++){const pr=i%6,fe=pr==0?3:pr==1?1:pr==2?2:99,t=[];
  for(let k=6;k>=1;k--){const f=k>fe;t.push({d:day(-k),t:+(f?100.6+r()*2.6:97.4+r()*1.6).toFixed(1),by:'Nurse Priya',time:'09:15'})}
  if(r()<.5)t.push({d:day(0),t:+(pr>2?100.8+r()*2:97.6+r()*1.2).toFixed(1),by:'Nurse Priya',time:'09:40'});
  S.p.push({id:'P-'+(1000+i),name:F[i%20]+' '+L[i%10],age:20+Math.floor(r()*55),phone:'98200'+String(10000+i),room:i,st:'admitted',temps:t,visits:[],treat:'',rec:false});
  S.ev.push({t:'adm',d:day(-Math.floor(r()*10))})}
 for(let i=0;i<20;i++){const dead=i<3;S.p.push({id:'P-'+(900+i),name:'Closed case '+(i+1),age:40,phone:'-',room:null,st:dead?'deceased':'recovered',temps:[],visits:[],treat:'',rec:false});
  S.ev.push({t:'adm',d:day(-20-i)},{t:dead?'dec':'rec',d:day(-Math.floor(r()*28))})}
 return S}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}if(!S)S=seed();S.log=S.log||[];S.wait=S.wait||[];if(S.fev)FEV=S.fev;
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let Q='';const lg=m=>{S.log.unshift(nowT()+' · '+m);S.log=S.log.slice(0,25)};
const flt=a=>Q?a.filter(p=>(p.name+p.id+p.room).toLowerCase().includes(Q.toLowerCase())):a;
const sb=()=>`<input id=q placeholder="Search name, ID or room" value="${esc(Q)}" oninput="Q=this.value;render();const e=$('#q');e.focus();e.setSelectionRange(9e3,9e3)" style="margin-bottom:10px">`;
const spark=p=>{const a=p.temps.slice(-10);if(a.length<2)return'';const w=300,h=60,mn=96,mx=104,x=i=>8+i*(w-16)/(a.length-1),y=t=>h-6-(Math.min(mx,Math.max(mn,t))-mn)/(mx-mn)*(h-12),ly=y(FEV);return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="60"><line x1="0" x2="${w}" y1="${ly}" y2="${ly}" stroke="var(--r)" stroke-dasharray="4 3"/><polyline fill="none" stroke="var(--a)" stroke-width="2" points="${a.map((t,i)=>x(i)+','+y(t.t)).join(' ')}"/>${a.map((t,i)=>`<circle cx="${x(i)}" cy="${y(t.t)}" r="3" fill="${fev(t.t)?'var(--r)':'var(--g)'}"/>`).join('')}</svg>`};
const get=id=>S.p.find(p=>p.id==id),adm=()=>S.p.filter(p=>p.st=='admitted');
const rd=(p,d)=>{const a=p.temps.filter(t=>t.d==d);return a[a.length-1]},fev=t=>t>=FEV;
const streak=p=>{let o=rd(p,day(0))?0:-1,c=0;for(;;o--){const r=rd(p,day(o));if(!r||fev(r.t))break;c++}return c};
const visited=p=>p.visits.find(v=>v.d==day(0));
const freeRoom=()=>{const u=new Set(adm().map(p=>p.room));for(let i=1;i<=CAP;i++)if(!u.has(i))return i;return 0};
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3200)}
const openD=h=>{$('#dlg').innerHTML=h;$('#dlg').showModal()};
const role=()=>S.user,go=r=>{location.hash='#'+r;render()};
function hist(p){const a=p.temps.slice(-8).reverse();return a.length?spark(p)+`<div class=wrap><table><tr><th>Date</th><th>Time</th><th>°F</th><th>By</th><th>Note</th></tr>${a.map(t=>`<tr><td>${t.d}</td><td>${t.time}</td><td><span class="tag ${fev(t.t)?'red':'grn'}">${t.t}</span></td><td>${esc(t.by)}</td><td>${esc(t.reason||'')}</td></tr>`).join('')}</table></div>`:'<p>No readings yet.</p>'}
const tTag=p=>{const r=rd(p,day(0));return r?`<span class="tag ${fev(r.t)?'red':'grn'}">${r.t}°F${fev(r.t)?' fever':''}</span>`:'<span class="tag yel">Pending</span>'};

const waitCard=()=>`<div class=card><h3>Waiting list (${S.wait.length})</h3>${S.wait.length?`${freeRoom()?'<div class="alert grn">A room is free. You can admit the next patient.</div>':''}<div class=wrap><table><tr><th>#</th><th>Name</th><th>Age</th><th></th></tr>${S.wait.map((w,i)=>`<tr><td>${i+1}</td><td>${esc(w.name)}</td><td>${w.age}</td><td><button ${freeRoom()?'':'disabled'} onclick="admitWait(${i})">Admit</button></td></tr>`).join('')}</table></div>`:'<p>Nobody waiting. Patients registered while all rooms are full are queued here.</p>'}</div>`;
const setCard=()=>`<div class=card><h3>Settings</h3><label>Fever threshold (°F) - drives fever flags and the 3-day count<input id=ft type=number step=0.1 value="${FEV}"></label><button onclick="setFev()">Save threshold</button></div>`;
const logCard=()=>`<div class=card><h3>Recent activity</h3>${S.log.length?S.log.slice(0,10).map(l=>`<div style="font-size:13px;padding:2px 0">${esc(l)}</div>`).join(''):'<p>No activity yet.</p>'}</div>`;
function setFev(){const v=parseFloat($('#ft').value);if(!(v>=99&&v<=103))return toast('Threshold must be between 99 and 103 °F.',1);FEV=S.fev=v;lg('Fever threshold set to '+v+'°F');save();render();toast('Threshold updated.')}
function admitWait(i){const w=S.wait[i],rm=freeRoom();if(!rm)return toast('No rooms available.',1);S.wait.splice(i,1);const id='P-'+(S.n++);S.p.push({id,name:w.name,age:w.age,phone:w.phone,room:rm,st:'admitted',temps:[],visits:[],treat:'',rec:false});S.ev.push({t:'adm',d:day(0)});lg('Admitted '+id+' from waiting list');save();render();toast(`Admitted ${id} to room ${rm}.`)}
/* ---------- views ---------- */
let AT='overview',FL='';
const chips=(cur,o,fn)=>`<div class=chips>${o.map(([k,l])=>`<button class="chip ${cur==k?'on':''}" onclick="${fn}('${k}')">${l}</button>`).join('')}</div>`;
const setAT=k=>{AT=k;Q='';render()},setFL=k=>{FL=k;Q='';render()};
const V={
admin(){const a=adm(),pend=a.filter(p=>p.rec),free=CAP-a.length;
 const tabs=chips(AT,[['overview','Overview'+(pend.length?` (${pend.length} to approve)`:'')],['register','Register patient'],['patients','All patients'],['wait',`Waiting list (${S.wait.length})`],['settings','Settings &amp; activity']],'setAT');let b='';
 if(AT=='overview')b=`${free==0?'<div class="alert red"><b>No rooms available.</b> All 74 rooms are full. Approve a discharge below to free a room.</div>':''}
 <div class=grid><div class=stat><b>${a.length} / ${CAP}</b><span>Rooms occupied</span></div><div class=stat><b>${free}</b><span>Rooms free</span></div><div class=stat><b>${pend.length}</b><span>Discharges to approve</span></div><div class=stat><b>${S.wait.length}</b><span>Patients waiting for a room</span></div></div>
 <div class=card><h3>Discharges waiting for your approval</h3>${pend.length?`<div class=wrap><table><tr><th>ID</th><th>Patient</th><th>Room</th><th></th></tr>${pend.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${p.room}</td><td><button onclick="disch('${p.id}')">Approve discharge</button></td></tr>`).join('')}</table></div>`:'<p>Nothing to approve right now. Doctors will recommend discharges here.</p>'}</div>`;
 else if(AT=='register')b=`<div class=card><h3>Register a new patient</h3><p>${free?free+' room(s) free. A room is assigned automatically.':'All rooms are full. The patient will be added to the waiting list.'}</p><div class=grid><label>Full name*<input id=rn></label><label>Age*<input id=ra type=number min=0 max=120></label><label>Emergency contact phone*<input id=rp></label></div><button onclick="reg()">Register patient</button></div>`;
 else if(AT=='patients')b=`<div class=card><h3>Admitted patients (${a.length})</h3>${sb()}<div class=wrap><table><tr><th>ID</th><th>Name</th><th>Age</th><th>Room</th></tr>${flt(a).map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${p.age}</td><td>${p.room}</td></tr>`).join('')}</table></div></div>
 <div class=card><h3>Discharged / closed cases</h3><div class=wrap><table><tr><th>ID</th><th>Name</th><th>Outcome</th></tr>${S.p.filter(p=>p.st!='admitted').slice(-12).reverse().map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}</td><td>${p.st=='recovered'?'Recovered / discharged':'Deceased'}</td></tr>`).join('')}</table></div></div>`;
 else if(AT=='wait')b=waitCard();else b=setCard()+logCard();
 return tabs+b},
nurse(){const a=adm(),pend=a.filter(p=>!rd(p,day(0))),done=a.length-pend.length,f=FL||'pending',list=flt(f=='pending'?pend:a).sort((x,y)=>x.room-y.room);
 return `<div class=card><h3>Today: ${done} of ${a.length} temperatures recorded</h3><div class=bar style="height:14px"><i style="width:${a.length?done/a.length*100:0}%;background:var(--g)"></i></div>${pend.length?`${pend.length} still to do.`:'<b>All done for today. Thank you!</b>'}</div>
 ${chips(f,[['pending',`Still to record (${pend.length})`],['all',`All patients (${a.length})`]],'setFL')}
 <div class=card>${sb()}${list.length?`<div class=wrap><table><tr><th>Room</th><th>Patient</th><th>Today's temperature</th><th></th></tr>${list.map(p=>`<tr><td>${p.room}</td><td>${esc(p.name)}</td><td>${tTag(p)}</td><td><button class="${rd(p,day(0))?'ghost':''}" onclick="recDlg('${p.id}')">${rd(p,day(0))?'View / correct':'Record temperature'}</button></td></tr>`).join('')}</table></div>`:'<p>No patients in this list.</p>'}</div>`},
doctor(){const a=adm(),vp=a.filter(p=>!visited(p)),rdy=a.filter(p=>streak(p)>=3&&!p.rec),fvr=a.filter(p=>{const r=rd(p,day(0));return r&&fev(r.t)}),f=FL||'visit',sets={visit:vp,ready:rdy,fever:fvr,all:a},list=flt(sets[f]||vp).sort((x,y)=>streak(y)-streak(x)||x.room-y.room);
 return `${rdy.length?`<div class="alert grn"><b>${rdy.length} patient(s) have 3 fever-free days.</b> Open "Ready for discharge" to review them.</div>`:''}
 ${chips(f,[['visit',`Needs visit today (${vp.length})`],['ready',`Ready for discharge (${rdy.length})`],['fever',`Fever today (${fvr.length})`],['all','All patients']],'setFL')}
 <div class=card>${sb()}${list.length?`<div class=wrap><table><tr><th>Room</th><th>Patient</th><th>Temperature today</th><th>Fever-free days</th><th>Visit today</th><th></th></tr>${list.map(p=>{const s=streak(p);return `<tr><td>${p.room}</td><td>${esc(p.name)}</td><td>${tTag(p)}</td><td><span class="tag ${s>=3?'grn':''}">${Math.min(s,3)} of 3</span></td><td>${visited(p)?'<span class="tag grn">Done</span>':'<span class="tag yel">Pending</span>'}${p.rec?' <span class="tag grn">Discharge recommended</span>':''}</td><td><button onclick="visDlg('${p.id}')">Examine</button></td></tr>`}).join('')}</table></div>`:'<p>No patients in this list.</p>'}</div>`},
management(){const rec=S.p.filter(p=>p.st=='recovered').length,dec=S.p.filter(p=>p.st=='deceased').length,out=rec+dec,mr=out?dec/out*100:0,rr=out?rec/out*100:0,a=adm().length;
 const rep=(n,l)=>{const f=S.ev.filter(e=>e.d>=day(-n));return `<tr><td>${l}</td><td>${f.filter(e=>e.t=='adm').length}</td><td>${f.filter(e=>e.t=='rec').length}</td><td>${f.filter(e=>e.t=='dec').length}</td></tr>`};
 return `${out>=10&&mr>15?`<div class="alert red"><b>Mortality rate has crossed 15%</b> (${mr.toFixed(1)}%). Review treatment quality.</div>`:'<div class="alert grn">Mortality is within the expected 15% benchmark.</div>'}
 <div class=grid><div class=stat><b>${a}/${CAP}</b><span>Current occupancy</span></div><div class=stat><b>${mr.toFixed(1)}%</b><span>Mortality (benchmark 15%)</span></div><div class=stat><b>${rr.toFixed(1)}%</b><span>Recovery (benchmark 85%)</span></div><div class=stat><b>${out}</b><span>Closed outcomes</span></div></div>
 <div class=card><h3>Performance vs benchmark</h3>Recovery ${rr.toFixed(1)}% of 85%<div class=bar><i style="width:${Math.min(100,rr)}%;background:var(--g)"></i></div>Mortality ${mr.toFixed(1)}% of 15%<div class=bar><i style="width:${Math.min(100,mr/15*100)}%;background:var(--r)"></i></div><small>Alert fires only after at least 10 closed outcomes.</small></div>
 <div class=card><h3>Reports</h3><div class=wrap><table><tr><th>Period</th><th>Admissions</th><th>Discharges (recovered)</th><th>Deaths</th></tr>${rep(0,'Daily')}${rep(6,'Weekly')}${rep(29,'Monthly')}</table></div></div>`}};

/* ---------- actions ---------- */
function reg(){const n=$('#rn').value.trim(),a=+$('#ra').value,p=$('#rp').value.trim();
 if(!n||!a||a<0||a>120||!p)return toast('Name, valid age and emergency contact are required.',1);
 const rm=freeRoom();if(adm().length>=CAP||!rm){S.wait.push({name:n,age:a,phone:p});lg('Added to waiting list: '+n);save();render();return toast('No rooms available. '+n+' added to the waiting list.',1)}
 const id='P-'+(S.n++);S.p.push({id,name:n,age:a,phone:p,room:rm,st:'admitted',temps:[],visits:[],treat:'',rec:false});S.ev.push({t:'adm',d:day(0)});lg(`Registered ${id} (${n}) in room ${rm}`);save();render();toast(`Registered ${id}, assigned room ${rm}.`)}
function disch(id){const p=get(id);if(!p.rec)return;p.st='recovered';p.room=null;S.ev.push({t:'rec',d:day(0)});lg(`${USERS.admin} discharged ${p.id}`);save();render();toast('Discharged. Room is now available.')}
function recDlg(id){const p=get(id),r=rd(p,day(0));
 openD(`<h3>Record temperature</h3><p>${esc(p.name)} &middot; Room ${p.room}</p>${r?`<div class="alert yel">Already recorded today (${r.t}°F at ${r.time}). A new reading needs a reason.</div>`:''}
 <label>Temperature (°F)<input id=tv type=number step=0.1 min=90 max=110 autofocus></label>${r?'<label>Reason for new reading*<input id=rs></label>':''}
 <h4>Recent readings</h4>${hist(p)}<div class=row><button onclick="saveT('${id}')">Save reading</button><button class=ghost onclick="dlg.close()">Cancel</button></div>`)}
function saveT(id){const p=get(id),r=rd(p,day(0)),v=parseFloat($('#tv').value),rs=r?$('#rs').value.trim():'';
 if(!(v>=90&&v<=110))return toast('Enter a temperature between 90 and 110 °F.',1);
 if(r&&!rs)return toast('A reason is required for a second reading today.',1);
 if(r&&!confirm('A reading already exists for today. Save another?'))return;
 p.temps.push({d:day(0),t:v,by:USERS.nurse,time:nowT(),reason:rs});lg(`${USERS.nurse} recorded ${v}°F for ${p.id}${rs?' (correction: '+rs+')':''}`);save();dlg.close();render();toast(fev(v)?`Saved: ${v}°F - fever flagged for doctor.`:`Saved: ${v}°F.`,fev(v))}
function visDlg(id){const p=get(id),r=rd(p,day(0)),v=visited(p),s=streak(p);
 openD(`<h3>${esc(p.name)} &middot; Room ${p.room}</h3><p>Today: ${tTag(p)} &middot; Fever-free days: <b>${s}</b>${r?'':'<br><span class="tag yel">Nurse has not recorded a temperature yet</span>'}</p>
 <h4>Temperature history</h4>${hist(p)}
 ${v?`<div class="alert grn">Visit recorded today: ${esc(v.notes)}${v.emerg?' (emergency exception)':''}</div>`:`<label>Examination notes*<textarea id=nt rows=3></textarea></label>${r?'':'<label class=chk><input type=checkbox id=em> Emergency: examine before temperature is recorded</label>'}`}
 <label>Treatment details<textarea id=tr rows=2>${esc(p.treat)}</textarea></label>
 <div class=row>${v?`<button onclick="treat('${id}')">Update treatment</button>`:`<button onclick="saveV('${id}')">Save visit</button>`}
 <button ${s>=3&&!p.rec?'':'disabled'} onclick="recommend('${id}')">Recommend discharge</button><button class="bad" onclick="died('${id}')">Record death</button><button class=ghost onclick="dlg.close()">Close</button></div>`)}
function saveV(id){const p=get(id),r=rd(p,day(0)),n=$('#nt').value.trim(),em=$('#em')&&$('#em').checked;
 if(visited(p))return toast('A visit is already recorded today.',1);
 if(!n)return toast('Examination notes are required.',1);
 if(!r&&!em)return toast("Today's temperature is pending. Tick the emergency exception to proceed.",1);
 p.visits.push({d:day(0),notes:n,emerg:!r&&em,by:USERS.doctor});lg(`${USERS.doctor} visited ${p.id}${em&&!r?' (emergency, temp pending)':''}`);p.treat=$('#tr').value.trim();save();dlg.close();render();toast(em&&!r?'Visit saved. Temperature check stays pending.':'Visit saved.')}
function treat(id){get(id).treat=$('#tr').value.trim();save();toast('Treatment updated.')}
function recommend(id){const p=get(id);if(streak(p)<3)return;p.rec=true;lg(`${USERS.doctor} recommended discharge for ${p.id}`);save();dlg.close();render();toast('Discharge recommended. Admin notified.')}
function died(id){if(!confirm('Record this patient as deceased? This frees the room.'))return;const p=get(id);p.st='deceased';p.room=null;S.ev.push({t:'dec',d:day(0)});lg(`Outcome recorded for ${p.id}: deceased`);save();dlg.close();render();toast('Outcome recorded.')}

/* ---------- shell ---------- */
const CR={admin:['admin','admin123'],nurse:['nurse','nurse123'],doctor:['doctor','doctor123'],management:['management','mgmt123']};
const G={admin:['Admin','Register patients, approve the discharges that doctors recommend, and keep rooms free.'],nurse:['Nurse',"Record each admitted patient's temperature once today. Patients still waiting are listed first."],doctor:['Doctor','Examine each patient today and recommend discharge after 3 fever-free days in a row.'],management:['Management','Check occupancy, mortality and recovery against the 15% and 85% targets.']};
const loginHtml=()=>`<div class=lg><div class=card><h2>Sign in to MediTrack</h2><p style="color:var(--m)">Enter your username and password.</p><label>Username<input id=lu autocomplete=username onkeydown="if(event.key=='Enter')doLogin()"></label><label>Password<input id=lp type=password autocomplete=current-password onkeydown="if(event.key=='Enter')doLogin()"></label><div id=le class=err></div><button style="width:100%" onclick="doLogin()">Sign in</button></div>
<div class=card><h3>Demo accounts</h3><p style="color:var(--m)">Prototype logins. Press <b>Sign in</b> on a row to log in directly.</p><div class=wrap><table><tr><th>Role</th><th>Username</th><th>Password</th><th></th></tr>${Object.keys(CR).map(r=>`<tr><td>${G[r][0]}</td><td><code>${CR[r][0]}</code></td><td><code>${CR[r][1]}</code></td><td><button onclick="doLogin('${CR[r][0]}','${CR[r][1]}')">Sign in</button></td></tr>`).join('')}</table></div></div></div>`;
function doLogin(u,p){u=(u??$('#lu').value).trim().toLowerCase();p=p??$('#lp').value;const r=Object.keys(CR).find(k=>CR[k][0]==u&&CR[k][1]==p);if(!r){$('#le').textContent='Incorrect username or password. Use one of the demo accounts.';return}login(r)}
function render(){const app=$('#app'),u=role();$('#who').innerHTML=u?`${esc(USERS[u])} &middot; ${G[u][0]} <button class=ghost style="color:inherit;border-color:#fff8;margin-left:8px" onclick="out()">Sign out</button>`:'';
 if(!u){app.innerHTML=loginHtml();return}
 const v=location.hash.slice(1)||u;
 app.innerHTML=`<div class=guide><b>You are signed in as ${G[u][0]}.</b> ${G[u][1]}</div>`+(v==u?V[u]():`<div class="card alert red"><h3>Access denied</h3>Your role (${G[u][0]}) cannot open this section.<div class=row><button onclick="go('${u}')">Back to my page</button></div></div>`)+`<p style="text-align:right"><a href="#" onclick="resetDemo();return false" style="color:var(--m)">Reset demo data</a></p>`}
function login(r){Q='';FL='';AT='overview';S.user=r;save();location.hash='#'+r;render()}
function out(){Q='';S.user=null;save();location.hash='';render()}
function resetDemo(){if(confirm('Reset all demo data?')){localStorage.removeItem(K);S=seed();render()}}
window.addEventListener('hashchange',render);render();
</script></body></html>
